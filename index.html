<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Werewolf: เกมล่าปริศนามนุษย์หมาป่า</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    },
                    colors: {
                        werewolf: {
                            dark: '#0B0F19',
                            card: '#161E2E',
                            border: '#2A374A',
                            accent: '#F59E0B',
                            night: '#1E1B4B',
                            day: '#0F172A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0B0F19;
            color: #E2E8F0;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .glow-gold {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        .glow-blue {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        .night-theme {
            background: linear-gradient(to bottom, #090d16, #141b2d);
        }
        .day-theme {
            background: linear-gradient(to bottom, #0f172a, #1e293b);
        }
    </style>
</head>
<body class="h-full flex flex-col min-h-screen overflow-x-hidden">

    <div id="app" class="flex-1 flex flex-col h-full max-w-7xl mx-auto w-full p-3 sm:p-5">
        <!-- Dynamic Application Shell inserted by JavaScript -->
    </div>

    <script>
        const GAME_CODES = [
            { code: "K9X2M7", used: false, player: null },
            { code: "R4V8P1", used: false, player: null },
            { code: "L3T9N5", used: false, player: null },
            { code: "H6B1Y8", used: false, player: null },
            { code: "Z7F4C2", used: false, player: null },
            { code: "W2Q8D9", used: false, player: null },
            { code: "J5X7G3", used: false, player: null },
            { code: "M9K1L6", used: false, player: null },
            { code: "T4N2V8", used: false, player: null },
            { code: "P8H5Z1", used: false, player: null }
        ];

        let state = {
            view: 'lobby_login', // 'lobby_login', 'waiting_room', 'role_screen', 'game_board', 'admin_panel', 'score_board', 'summary_screen'
            currentUser: null, // { name: '', code: '', role: '', status: '', isReady: false }
            players: [
                { id: 1, name: "บอส (AI)", code: "BOT-A1", role: "werewolf", faction: "werewolf", status: "ยังมีชีวิต", isReady: true, isBot: true },
                { id: 2, name: "มิน (AI)", code: "BOT-A2", role: "seer", faction: "villager", status: "ยังมีชีวิต", isReady: true, isBot: true },
                { id: 3, name: "นนท์ (AI)", code: "BOT-A3", role: "doctor", faction: "villager", status: "ยังมีชีวิต", isReady: true, isBot: true },
                { id: 4, name: "ฝน (AI)", code: "BOT-A4", role: "werewolf", faction: "werewolf", status: "ยังมีชีวิต", isReady: true, isBot: true },
                { id: 5, name: "พีท (AI)", code: "BOT-A5", role: "villager", faction: "villager", status: "ยังมีชีวิต", isReady: true, isBot: true }
            ],
            gamePhase: 'waiting',
            dayNumber: 1,
            nightActions: { werewolfTarget: null, seerTarget: null, doctorTarget: null },
            lastNightSummary: "ยินดีต้อนรับสู่เกม Werewolf (ประเทศไทย)",
            adminPassword: "toy@2532", // Default password toy@2532
            settings: {
                aliveText: "ยังมีชีวิต",
                deadText: "ออกจากเกมแล้ว",
                showUnregisteredOnBoard: true,
                winPoints: 10,
                lossPoints: 0
            },
            scores: {},
            modalMessage: null
        };

        function showModal(msg) {
            state.modalMessage = msg;
            render();
        }

        function closeModal() {
            state.modalMessage = null;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            let html = '';

            // Responsive Modal dialog
            if (state.modalMessage) {
                html += `
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <div class="bg-werewolf-card border border-werewolf-border rounded-2xl p-5 sm:p-6 max-w-sm w-full glow-gold shadow-2xl">
                        <div class="flex items-center space-x-3 mb-3 text-amber-400">
                            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                            <h3 class="text-lg font-bold">แจ้งเตือนระบบ</h3>
                        </div>
                        <p class="text-gray-300 mb-5 text-sm leading-relaxed">${state.modalMessage}</p>
                        <div class="flex justify-end">
                            <button onclick="closeModal()" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition text-sm">
                                ตกลง
                            </button>
                        </div>
                    </div>
                </div>`;
            }

            // Mobile-Friendly Header Navigation Bar
            html += `
            <header class="flex flex-col sm:flex-row justify-between items-center pb-3 mb-3 border-b border-werewolf-border gap-2">
                <div class="flex items-center space-x-3 cursor-pointer w-full sm:w-auto justify-between sm:justify-start" onclick="goToLobby()">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 glow-gold">
                            <i class="fa-solid fa-moon text-lg"></i>
                        </div>
                        <div>
                            <h1 class="text-lg sm:text-xl font-bold tracking-wider text-amber-400">WEREWOLF</h1>
                            <p class="text-[10px] text-gray-400">เกมล่าปริศนามนุษย์หมาป่า</p>
                        </div>
                    </div>
                    <div class="flex sm:hidden items-center space-x-2">
                        <button onclick="openAdminLogin()" class="bg-slate-800 p-2 rounded-xl text-amber-400 border border-slate-700 text-xs" title="แอดมิน">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                        <button onclick="openScoreboard()" class="bg-slate-800 p-2 rounded-xl text-amber-400 border border-slate-700 text-xs" title="ตารางคะแนน">
                            <i class="fa-solid fa-trophy"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
                    ${state.currentUser ? `
                        <div class="bg-slate-800/90 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center space-x-2 text-xs">
                            <span class="w-2 h-2 rounded-full ${state.currentUser.status === 'ยังมีชีวิต' || state.currentUser.status === 'กำลังเล่น' ? 'bg-green-500 animate-pulse' : 'bg-red-500'}"></span>
                            <span class="font-medium text-gray-200">${state.currentUser.name}</span>
                            <span class="bg-slate-900 px-2 py-0.5 rounded text-amber-400 border border-slate-700">${state.currentUser.status}</span>
                        </div>
                    ` : `
                        <div class="bg-slate-800/90 border border-slate-700 px-3 py-1.5 rounded-xl text-xs text-amber-400">
                            <i class="fa-solid fa-user-slash mr-1"></i> ยังไม่เข้าสู่ระบบ
                        </div>
                    `}
                    
                    <button onclick="openAdminLogin()" class="hidden sm:flex bg-slate-800 hover:bg-slate-700 border border-slate-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs transition items-center space-x-1">
                        <i class="fa-solid fa-gear text-amber-400"></i>
                        <span>ตั้งค่าผู้ดูแล</span>
                    </button>
                    
                    <button onclick="openScoreboard()" class="hidden sm:flex bg-slate-800 hover:bg-slate-700 border border-slate-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs transition items-center space-x-1">
                        <i class="fa-solid fa-trophy text-amber-400"></i>
                        <span>ตารางคะแนน</span>
                    </button>
                </div>
            </header>`;

            // Render current screen view
            if (state.view === 'lobby_login') {
                html += renderLobbyLoginScreen();
            } else if (state.view === 'waiting_room') {
                html += renderWaitingRoomScreen();
            } else if (state.view === 'role_screen') {
                html += renderRoleScreen();
            } else if (state.view === 'game_board') {
                html += renderGameBoardScreen();
            } else if (state.view === 'admin_panel') {
                html += renderAdminPanelScreen();
            } else if (state.view === 'score_board') {
                html += renderScoreboardScreen();
            } else if (state.view === 'summary_screen') {
                html += renderSummaryScreen();
            }

            app.innerHTML = html;
        }

        function renderLobbyLoginScreen() {
            const totalPlayersCount = state.players.length + (state.currentUser ? 1 : 0);
            
            return `
            <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 items-start pb-6">
                <!-- Left: Login Form & Card-Style Character Showcase Intro -->
                <div class="lg:col-span-5 bg-werewolf-card border border-werewolf-border rounded-2xl p-4 sm:p-6 glow-blue flex flex-col justify-between">
                    <div>
                        <!-- Card-Style Character Showcase Reference Grid matching user image -->
                        <div class="w-full bg-slate-900/90 rounded-2xl border border-slate-800 p-3 mb-4 shadow-inner">
                            <div class="text-[11px] text-amber-400 font-bold mb-2.5 tracking-wider flex items-center justify-between">
                                <span class="flex items-center space-x-1"><i class="fa-solid fa-id-card"></i> <span>ตัวละครหลักในหมู่บ้าน</span></span>
                                <span class="text-[9px] text-gray-400">4 บทบาทสำคัญ</span>
                            </div>
                            <div class="grid grid-cols-4 gap-2 overflow-x-auto pb-1">
                                <!-- Card 1: หมาป่า -->
                                <div class="bg-slate-950 border border-red-500/40 rounded-xl p-2 flex flex-col items-center text-center shadow-md">
                                    <div class="text-[10px] font-bold text-amber-300 truncate w-full mb-1">หมาป่า</div>
                                    <div class="w-full h-14 bg-red-950/40 rounded-lg border border-red-500/30 flex items-center justify-center text-xl mb-2">🐺</div>
                                    <div class="w-full bg-amber-500/10 border border-amber-500/30 rounded py-1 text-[9px] text-amber-400 font-semibold truncate">คุมคืน</div>
                                </div>
                                <!-- Card 2: ผู้หยั่งรู้ -->
                                <div class="bg-slate-950 border border-amber-500/40 rounded-xl p-2 flex flex-col items-center text-center shadow-md">
                                    <div class="text-[10px] font-bold text-amber-300 truncate w-full mb-1">ผู้หยั่งรู้</div>
                                    <div class="w-full h-14 bg-amber-950/40 rounded-lg border border-amber-500/30 flex items-center justify-center text-xl mb-2">👁️</div>
                                    <div class="w-full bg-amber-500/10 border border-amber-500/30 rounded py-1 text-[9px] text-amber-400 font-semibold truncate">ส่องเป้า</div>
                                </div>
                                <!-- Card 3: หมอ -->
                                <div class="bg-slate-950 border border-blue-500/40 rounded-xl p-2 flex flex-col items-center text-center shadow-md">
                                    <div class="text-[10px] font-bold text-amber-300 truncate w-full mb-1">หมอ</div>
                                    <div class="w-full h-14 bg-blue-950/40 rounded-lg border border-blue-500/30 flex items-center justify-center text-xl mb-2">🛡️</div>
                                    <div class="w-full bg-amber-500/10 border border-amber-500/30 rounded py-1 text-[9px] text-amber-400 font-semibold truncate">ปกป้อง</div>
                                </div>
                                <!-- Card 4: ชาวบ้าน -->
                                <div class="bg-slate-950 border border-emerald-500/40 rounded-xl p-2 flex flex-col items-center text-center shadow-md">
                                    <div class="text-[10px] font-bold text-amber-300 truncate w-full mb-1">ชาวบ้าน</div>
                                    <div class="w-full h-14 bg-emerald-950/40 rounded-lg border border-emerald-500/30 flex items-center justify-center text-xl mb-2">👤</div>
                                    <div class="w-full bg-amber-500/10 border border-amber-500/30 rounded py-1 text-[9px] text-amber-400 font-semibold truncate">โหวต</div>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mb-4">
                            <h2 class="text-xl sm:text-2xl font-bold text-white">เข้าสู่เกมหมาป่า</h2>
                            <p class="text-xs text-gray-400 mt-0.5">กรอกชื่อย่อและรหัสประจำตัว 6 หลัก (เช่น 555KK5)</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-300 uppercase tracking-wider mb-1">ชื่อย่อผู้เล่น</label>
                                <input type="text" id="loginName" required placeholder="ระบุชื่อย่อของคุณ" 
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-amber-500 transition">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-300 uppercase tracking-wider mb-1">รหัสประจำตัว 6 หลัก</label>
                                <input type="text" id="loginCode" required maxlength="6" placeholder="เช่น 555KK5" 
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-3 text-sm text-white font-mono uppercase tracking-widest focus:outline-none focus:border-amber-500 transition">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg glow-gold text-sm mt-1">
                                <i class="fa-solid fa-right-to-bracket mr-2"></i> เข้าสู่เกม
                            </button>
                        </form>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-800 text-[11px] text-gray-500 text-center">
                        ระบบป้องกันความปลอดภัย 6 หลักมาตรฐาน
                    </div>
                </div>

                <!-- Right: Public Player Status Board -->
                <div class="lg:col-span-7 bg-werewolf-card border border-werewolf-border rounded-2xl p-4 sm:p-6 flex flex-col h-full">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-users-rectangle text-amber-400 text-lg"></i>
                            <h3 class="text-base sm:text-lg font-bold text-white">บอร์ดสถานะผู้เล่น (สาธารณะ)</h3>
                        </div>
                        <span class="text-[11px] bg-slate-800 px-2.5 py-1 rounded-full text-amber-400 border border-slate-700">
                            ${totalPlayersCount} / 10 คน
                        </span>
                    </div>
                    <p class="text-xs text-gray-400 mb-3">ตรวจสอบรายชื่อและสถานะของผู้เล่นก่อนเข้าร่วมเกม</p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 overflow-y-auto max-h-[360px] sm:max-h-[400px] pr-1">
                        ${renderPublicPlayerList()}
                    </div>

                    <div class="mt-4 bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 text-xs text-gray-400 flex items-start space-x-2.5">
                        <i class="fa-solid fa-circle-info text-amber-400 mt-0.5 text-sm"></i>
                        <div>
                            <span class="font-semibold text-gray-300">คำแนะนำ:</span> บอร์ดนี้จะอัปเดตสถานะผู้เล่นแบบเรียลไทม์โดยไม่มีการเปิดเผยข้อมูลบทบาทลับ
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderPublicPlayerList() {
            let listHtml = '';
            let allParticipants = [...state.players];
            if (state.currentUser) {
                allParticipants.push({
                    name: state.currentUser.name,
                    code: state.currentUser.code,
                    status: state.currentUser.status,
                    isCurrent: true
                });
            }

            if (allParticipants.length === 0) {
                return `<div class="col-span-2 text-center py-8 text-gray-500 text-xs">ยังไม่มีผู้เล่นในระบบ</div>`;
            }

            allParticipants.forEach((p, idx) => {
                const isAlive = p.status === 'ยังมีชีวิต' || p.status === 'อยู่ในห้องรอ' || p.status === 'กำลังเล่น' || p.status === 'พร้อมแล้ว';
                const statusColor = isAlive ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-red-500/10 border-red-500/30 text-red-400';
                const icon = isAlive ? 'fa-heart-pulse' : 'fa-skull';

                listHtml += `
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 sm:p-3 flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-amber-400">
                            #${idx + 1}
                        </div>
                        <div>
                            <div class="font-semibold text-gray-200 flex items-center space-x-1.5">
                                <span>${p.name}</span>
                                ${p.isCurrent ? '<span class="text-[9px] bg-amber-500/20 text-amber-400 px-1 py-0.5 rounded">คุณ</span>' : ''}
                            </div>
                            <div class="text-[10px] text-gray-400">รหัส: ${p.code || 'WLF-0' + (idx+1)}</div>
                        </div>
                    </div>
                    <div class="px-2 py-0.5 rounded-lg border text-[11px] flex items-center space-x-1 ${statusColor}">
                        <i class="fa-solid ${icon}"></i>
                        <span>${p.status}</span>
                    </div>
                </div>`;
            });

            for (let i = allParticipants.length; i < 10; i++) {
                if (state.settings.showUnregisteredOnBoard) {
                    listHtml += `
                    <div class="bg-slate-900/30 border border-slate-800/60 rounded-xl p-2.5 sm:p-3 flex items-center justify-between opacity-60 text-xs">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center font-bold text-gray-600">
                                #${i + 1}
                            </div>
                            <div>
                                <div class="font-semibold text-gray-500">ช่องว่างผู้เล่น</div>
                                <div class="text-[10px] text-gray-600">รหัสว่าง</div>
                            </div>
                        </div>
                        <div class="px-2 py-0.5 rounded-lg border border-slate-800 text-[11px] text-gray-500 bg-slate-900/50">
                            <i class="fa-solid fa-clock mr-1"></i> รอเข้าร่วม
                        </div>
                    </div>`;
                }
            }

            return listHtml;
        }

        function renderWaitingRoomScreen() {
            const totalCount = state.players.length + 1;
            const readyCount = state.players.filter(p => p.isReady).length + (state.currentUser.isReady ? 1 : 0);
            const canStart = totalCount >= 6;

            return `
            <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 items-start pb-6">
                <!-- Left: Controls -->
                <div class="lg:col-span-5 bg-werewolf-card border border-werewolf-border rounded-2xl p-4 sm:p-6 glow-blue flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                            <div>
                                <span class="bg-green-500/10 border border-green-500/30 text-green-400 px-2.5 py-1 rounded-xl text-[11px] font-semibold">
                                    <i class="fa-solid fa-circle-check mr-1"></i> เข้าสู่เกมสำเร็จ
                                </span>
                                <h2 class="text-xl font-bold text-white mt-1.5">ห้องรอผู้เล่น</h2>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-extrabold text-amber-400">${totalCount}/10</div>
                                <div class="text-[10px] text-gray-400">ผู้เล่นในห้อง</div>
                            </div>
                        </div>

                        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3.5 mb-4 text-xs">
                            <div class="text-gray-400 mb-1">สถานะส่วนตัวของคุณ</div>
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-white text-sm">${state.currentUser.name}</span>
                                <span class="px-2.5 py-0.5 rounded-lg font-semibold ${state.currentUser.isReady ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                    ${state.currentUser.isReady ? 'พร้อมแล้ว' : 'ยังไม่พร้อม'}
                                </span>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <button onclick="toggleReady()" class="w-full py-3.5 rounded-xl font-bold transition shadow-lg text-sm ${state.currentUser.isReady ? 'bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30' : 'bg-green-500 hover:bg-green-600 text-slate-950'}">
                                <i class="fa-solid ${state.currentUser.isReady ? 'fa-xmark' : 'fa-check'} mr-2"></i>
                                ${state.currentUser.isReady ? 'ยกเลิกสถานะพร้อม' : 'กดพร้อมเริ่มเกม'}
                            </button>

                            <button onclick="simulateAddBot()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-gray-300 py-2.5 rounded-xl text-xs font-medium transition">

                    <div class="font-bold text-amber-400"><i class="fa-solid fa-comments mr-1"></i> ช่วงเวลาร่วมอภิปรายและจับพิรุธ</div>
                    <p class="text-gray-300 text-[11px]">พูดคุย วิเคราะห์เบาะแส และหาตัวหมาป่าร่วมกับเพื่อนร่วมหมู่บ้าน</p>

                </div>`;

                return `

                    <div class="font-bold text-red-400"><i class="fa-solid fa-check-to-slot mr-1"></i> เลือกผู้ต้องสงสัยเพื่อโหวตขับออกจากหมู่บ้าน:</div>
                    <select id="voteTargetSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white">
                        <option value="">-- เลือกผู้เล่นที่ต้องการโหวต --</option>

                    </select>
                    <button onclick="submitVoteAction()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl transition">

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const code = document.getElementById('loginCode').value.trim().toUpperCase();

            const foundCode = GAME_CODES.find(c => c.code === code);
            if (!foundCode) {
                showModal("รหัสประจำตัว 6 หลักไม่ถูกต้อง! กรุณาตรวจสอบรหัสผู้เล่น");
                return;
            }
            if (foundCode.used) {
                showModal("รหัสประจำตัวนี้ถูกใช้งานแล้วในรอบเกมนี้! โปรดใช้รหัสอื่น");
                return;
            }

            foundCode.used = true;
            foundCode.player = name;

            state.currentUser = {
                name: name,
                code: code,
                role: null,
                status: 'อยู่ในห้องรอ',
                isReady: false,
                score: 0
            };

            state.view = 'waiting_room';
            render();
        }

        function toggleReady() {
            state.currentUser.isReady = !state.currentUser.isReady;
            state.currentUser.status = state.currentUser.isReady ? 'พร้อมแล้ว' : 'ยังไม่พร้อม';
            checkAutoStart();
            render();
        }

        function simulateAddBot() {
            if (state.players.length >= 9) {
                showModal("ผู้เล่นเต็มจำนวน 10 คนแล้ว!");
                return;
            }
            const botId = state.players.length + 1;
            const botNames = ["เดชา", "วิชัย", "สมชาย", "มานพ", "ก้อง", "ธีร์", "ชัย", "ปูรณ์"];
            const randomName = botNames[state.players.length % botNames.length] + " (AI)";
            
            state.players.push({
                id: botId + 10,
                name: randomName,
                code: `BOT-${botId}`,
                role: "villager",
                faction: "villager",
                status: "ยังมีชีวิต",
                isReady: true,
                isBot: true
            });
            checkAutoStart();
            render();
        }

        function checkAutoStart() {
            const allPlayers = [state.currentUser, ...state.players];
            const allReady = allPlayers.every(p => p.isReady);
            if (allReady && allPlayers.length >= 6) {
                 startGameProcess();
            }
        }

        function forceStartGame() {
            const total = state.players.length + 1;
            if (total < 6) {
                showModal("ต้องการผู้เล่นอย่างน้อย 6 คนจึงจะเริ่มเกมได้ (ปัจจุบันมี " + total + " คน)");
                return;
            }
            startGameProcess();
        }

        function startGameProcess() {
            const allParticipants = [state.currentUser, ...state.players];
            const total = allParticipants.length;

            let rolesPool = ['werewolf', 'werewolf', 'seer', 'doctor'];
            while (rolesPool.length < total) {
                rolesPool.push('villager');
            }
            rolesPool.sort(() => Math.random() - 0.5);

            state.currentUser.role = rolesPool[0];
            state.currentUser.status = 'กำลังเล่น';
            
            state.players.forEach((p, idx) => {
                p.role = rolesPool[idx + 1];
                p.status = 'ยังมีชีวิต';
            });

            state.gamePhase = 'night';
            state.dayNumber = 1;
            state.lastNightSummary = "เกมเริ่มต้นขึ้นแล้ว คืนแรกของหมู่บ้านอันเงียบสงบ...";
            state.view = 'role_screen';
            render();
        }

        function enterGameMainBoard() {
            state.view = 'game_board';
            render();
        }

        function submitNightAction(roleType) {
            const isAlive = state.currentUser.status === 'ยังมีชีวิต' || state.currentUser.status === 'กำลังเล่น' || state.currentUser.status === 'พร้อมแล้ว';
            if (!isAlive || state.currentUser.status === 'ออกจากเกมแล้ว' || state.currentUser.status === 'ตายแล้ว') {
                showModal("คุณออกจากเกมแล้ว ไม่สามารถใช้ความสามารถได้!");
                return;
            }

            const selectEl = document.getElementById('nightTargetSelect');
            if (!selectEl || !selectEl.value) {
                showModal("กรุณาเลือกเป้าหมายก่อนยืนยัน");
                return;
            }

            const targetVal = selectEl.value;
            if (roleType === 'werewolf') {
                state.nightActions.werewolfTarget = targetVal;
                showModal("คุณได้เลือกเป้าหมายการล่าในคืนนี้แล้ว");
            } else if (roleType === 'seer') {
                state.nightActions.seerTarget = targetVal;
                const targetPlayer = state.players.find(p => p.id == targetVal);
                const isWolf = targetPlayer && targetPlayer.role === 'werewolf';
                showModal(`ผลการตรวจสอบของผู้หยั่งรู้: เป้าหมาย "${targetPlayer ? targetPlayer.name : 'ผู้เล่น'}" ${isWolf ? 'เป็นมนุษย์หมาป่า!' : 'ไม่ใช่มนุษย์หมาป่า'}`);
            } else if (roleType === 'doctor') {
                state.nightActions.doctorTarget = targetVal;
                showModal("คุณได้เลือกปกป้องผู้เล่นเป้าหมายในคืนนี้เรียบร้อยแล้ว");
            }

            setTimeout(() => {
                resolveNightPhase();
            }, 1000);
        }

        function resolveNightPhase() {
            const wolfTargetId = state.nightActions.werewolfTarget;
            const docTargetId = state.nightActions.doctorTarget;

            if (wolfTargetId) {
                if (wolfTargetId === docTargetId) {
                    state.lastNightSummary = "คืนที่ผ่านมา หมาป่าออกล่าเหยื่อ แต่หมอช่วยชีวิตไว้ทัน! ไม่มีผู้เสียชีวิต";
                } else {
                    const victim = state.players.find(p => p.id == wolfTargetId);
                    if (victim) {
                        victim.status = state.settings.deadText || 'ออกจากเกมแล้ว';
                        state.lastNightSummary = `คืนที่ผ่านมา น่าสลดใจ "${victim.name}" ถูกมนุษย์หมาป่าจู่โจมและเสียชีวิต`;
                    }
                }
            } else {
                state.lastNightSummary = "คืนที่ผ่านมา สงบเรียบร้อย ไม่มีผู้เสียชีวิต";
            }

            state.gamePhase = 'day_discussion';
            if (checkWinCondition()) return;
            render();
        }

        function startVotePhase() {
            state.gamePhase = 'day_vote';
            render();
        }

        function submitVoteAction() {
            const isAlive = state.currentUser.status === 'ยังมีชีวิต' || state.currentUser.status === 'กำลังเล่น' || state.currentUser.status === 'พร้อมแล้ว';
            if (!isAlive || state.currentUser.status === 'ออกจากเกมแล้ว' || state.currentUser.status === 'ตายแล้ว') {
                showModal("คุณออกจากเกมแล้ว ไม่สามารถลงคะแนนโหวตได้!");
                return;
            }

            const selectEl = document.getElementById('voteTargetSelect');
            if (!selectEl || !selectEl.value) {
                showModal("กรุณาเลือกผู้เล่นที่ต้องการโหวต");
                return;
            }

            const votedId = selectEl.value;
            const votedPlayer = state.players.find(p => p.id == votedId);
            
            if (votedPlayer) {
                votedPlayer.status = state.settings.deadText || 'ออกจากเกมแล้ว';
                state.lastNightSummary = `ผลการลงคะแนนประจำวัน: ชาวบ้านลงมติขับไล่ "${votedPlayer.name}" ออกจากหมู่บ้านสำเร็จ`;
            }

            state.gamePhase = 'night';
            state.dayNumber++;

            if (checkWinCondition()) return;
            render();
        }

        function toggleDayNight() {
            if (state.gamePhase === 'night') {
                state.gamePhase = 'day_discussion';
                state.lastNightSummary = "ผู้ดูแลสลับเวลาเป็นกลางวันทันที";
            } else {
                state.gamePhase = 'night';
                state.lastNightSummary = "ผู้ดูแลสลับเวลาเป็นกลางคืนทันที";
            }
            render();
        }

        function checkWinCondition() {
            const allAlive = [state.currentUser, ...state.players].filter(p => p.status === 'ยังมีชีวิต' || p.status === 'กำลังเล่น' || p.status === 'พร้อมแล้ว');
            const aliveWolves = allAlive.filter(p => p.role === 'werewolf');
            const aliveVillagers = allAlive.filter(p => p.role !== 'werewolf');

            if (aliveWolves.length === 0) {
                endGame("ฝ่ายชาวบ้านชนะ! กำจัดมนุษย์หมาป่าทั้งหมดได้สำเร็จ", "villager");
                return true;
            } else if (aliveWolves.length >= aliveVillagers.length) {
                endGame("ฝ่ายมนุษย์หมาป่าชนะ! จำนวนหมาป่าเท่ากับหรือมากกว่าชาวบ้าน", "werewolf");
                return true;
            }
            return false;
        }

        function endGame(summaryText, winningFaction) {
            state.lastNightSummary = summaryText;
            state.gamePhase = 'ended';

            const isUserWinner = (state.currentUser.role === 'werewolf' && winningFaction === 'werewolf') || 
                                 (state.currentUser.role !== 'werewolf' && winningFaction === 'villager');

            if (!state.scores[state.currentUser.code]) {
                state.scores[state.currentUser.code] = { name: state.currentUser.name, totalScore: 0, wins: 0, played: 0 };
            }
            state.scores[state.currentUser.code].played++;
            if (isUserWinner) {
                state.scores[state.currentUser.code].wins++;
                state.scores[state.currentUser.code].totalScore += state.settings.winPoints;
                state.currentUser.finalResult = "ชนะ";
            } else {
                state.scores[state.currentUser.code].totalScore += state.settings.lossPoints;
                state.currentUser.finalResult = "แพ้";
            }

            state.view = 'summary_screen';
            render();
        }

                        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-3.5 text-xs">
                            <h4 class="font-bold text-white mb-2 flex items-center space-x-2">
                                <i class="fa-solid fa-shield-halved text-amber-400"></i>
                                <span>ตั้งค่ารหัสผ่านแอดมิน</span>
                            </h4>

                            <div>
                                <label class="block text-[11px] font-semibold text-gray-300 mb-1">รหัสผ่านปัจจุบัน</label>
                                <input type="text" id="adminNewPasswordInput" value="${state.adminPassword}"
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white text-xs">
                            </div>
                            <button onclick="updateAdminPassword()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 py-2 rounded-xl font-semibold transition">
                                บันทึกรหัสผ่านใหม่
                            </button>

                            <div class="pt-2.5 border-t border-slate-800 space-y-2">
                                <button onclick="resetAllScores()" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 py-2 rounded-xl font-semibold transition">
                                    <i class="fa-solid fa-trash-can mr-1"></i> รีเซ็ตคะแนนสะสมทั้งหมด
                                </button>
                                <button onclick="goToLobby()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 py-2.5 rounded-xl font-bold transition">
                                    กลับสู่เกม
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function updateAdminPassword() {
            const val = document.getElementById('adminNewPasswordInput').value.trim();
            if (!val) {
                showModal("รหัสผ่านผู้ดูแลต้องไม่ว่างเปล่า");
                return;
            }
            state.adminPassword = val;
            showModal("อัปเดตและบันทึกรหัสผ่านผู้ดูแลระบบเรียบร้อยแล้ว");
        }

        function resetAllCodes() {
            GAME_CODES.forEach(c => { c.used = false; c.player = null; });
            showModal("รีเซ็ตสถานะรหัสผู้เล่นทั้ง 10 รหัสเรียบร้อยแล้ว");
        }

        function resetAllScores() {
            if (confirm("คุณแน่ใจหรือไม่ที่จะรีเซ็ตคะแนนสะสมทั้งหมด?")) {
                state.scores = {};
                showModal("รีเซ็ตคะแนนสะสมผู้เล่นทั้งหมดเรียบร้อยแล้ว");
            }
        }

        function goToLobby() {
            state.view = 'lobby_login';
            render();
        }

        function restartNewGame() {
            state.currentUser.status = 'อยู่ในห้องรอ';
            state.currentUser.isReady = false;
            state.currentUser.role = null;
            state.players.forEach(p => {
                p.status = 'ยังมีชีวิต';
                p.isReady = true;
            });
            state.view = 'waiting_room';
            render();
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
